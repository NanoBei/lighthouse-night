<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海边灯塔夜景</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1224; overflow: hidden; }
  canvas { display: block; }
  #fallback { position: fixed; inset: 0; z-index: 20; display: none;
    place-items: center; background: #0a1224; color: #8ab4ff;
    font: 15px/1.8 system-ui, sans-serif; text-align: center; }
  #fallback.show { display: grid; }
</style>
</head>
<body>
<div id="fallback">
  <div>
    <p>⚠️ Three.js 加载失败</p>
    <p>本页面需要联网从 CDN 加载 Three.js，请检查网络后刷新重试。</p>
  </div>
</div>

<script nomodule>document.getElementById('fallback').classList.add('show');</script>
<script type="module">
/* ============================================================
 * 配置区：全部可调参数集中于此
 * ============================================================ */
const CONFIG = {
  cdns: [
    'https://registry.npmmirror.com/three/0.187.0/files/build/three.module.js',
    'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js',
  ],
  camera: { fov: 50, position: [11, 6.5, 15], lookAt: [0, 4, 0] },
  tower: {
    baseY: 1.0,          // 塔身起始高度（立于礁石台面）
    height: 6,           // 塔身总高
    bottomRadius: 1.2,
    topRadius: 0.7,
    stripes: 5,          // 条纹段数（红白交替）
  },
  lantern: { radius: 0.55, height: 0.9 },
  rocks: { seed: 20261119, count: 9, islandRadius: 3.0 },
  sea: { size: 240, color: 0x0b1e3a },
  sky: { color: 0x0a1224 },
  lights: {
    hemi: { sky: 0x2a3a5e, ground: 0x0a0e1a, intensity: 0.55 },
    moon: { color: 0xbdd4ff, intensity: 2.2, position: [18, 24, -10] },
    lamp: { color: 0xffd9a0, intensity: 60, distance: 45 },
  },
};

/* ============================================================
 * 加载：双 CDN 源动态 import，双源均失败显示兜底提示
 * ============================================================ */
let THREE = null;
for (const url of CONFIG.cdns) {
  try { THREE = await import(url); break; } catch (e) { /* 换下一个源 */ }
}
if (!THREE) {
  document.getElementById('fallback').classList.add('show');
  throw new Error('all CDNs failed');
}

/* ============================================================
 * 场景与灯光
 * ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.sky.color);

const camera = new THREE.PerspectiveCamera(
  CONFIG.camera.fov, innerWidth / innerHeight, 0.1, 500);
camera.position.set(...CONFIG.camera.position);
camera.lookAt(...CONFIG.camera.lookAt);

scene.add(new THREE.HemisphereLight(
  CONFIG.lights.hemi.sky, CONFIG.lights.hemi.ground, CONFIG.lights.hemi.intensity));

const moonLight = new THREE.DirectionalLight(
  CONFIG.lights.moon.color, CONFIG.lights.moon.intensity);
moonLight.position.set(...CONFIG.lights.moon.position);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -20;
moonLight.shadow.camera.right = 20;
moonLight.shadow.camera.top = 20;
moonLight.shadow.camera.bottom = -20;
scene.add(moonLight);

const lampLight = new THREE.PointLight(
  CONFIG.lights.lamp.color, CONFIG.lights.lamp.intensity, CONFIG.lights.lamp.distance);
lampLight.position.set(0, 7.85, 0); // 灯室内部
scene.add(lampLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
 * 灯塔与礁石
 * ============================================================ */
// 确定性伪随机：相同 seed 每次刷新结果一致
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 基于坐标的噪声：保证同一几何体的重合顶点扰动一致（面不裂开）
function vertexNoise(x, y, z) {
  const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  return s - Math.floor(s);
}

const mats = {
  red:   new THREE.MeshStandardMaterial({ color: 0xc0392b, flatShading: true, roughness: 0.85 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe8e4d8, flatShading: true, roughness: 0.85 }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x2c3444, flatShading: true, roughness: 0.9 }),
  glass: new THREE.MeshStandardMaterial({
    color: 0xfff2cc, emissive: 0xffb347, emissiveIntensity: 1.4, roughness: 0.4 }),
};

function buildTower() {
  const g = new THREE.Group();
  const { baseY, height, bottomRadius, topRadius, stripes } = CONFIG.tower;
  const segH = height / stripes;

  for (let i = 0; i < stripes; i++) {
    const t0 = i / stripes, t1 = (i + 1) / stripes;
    const rb = bottomRadius + (topRadius - bottomRadius) * t0;
    const rt = bottomRadius + (topRadius - bottomRadius) * t1;
    const seg = new THREE.Mesh(
      new THREE.CylinderGeometry(rt, rb, segH, 16, 1),
      i % 2 === 0 ? mats.red : mats.white);
    seg.position.y = baseY + segH * (i + 0.5);
    seg.castShadow = seg.receiveShadow = true;
    g.add(seg);
  }

  // 阳台
  const deck = new THREE.Mesh(
    new THREE.CylinderGeometry(topRadius + 0.28, topRadius + 0.28, 0.16, 16),
    mats.dark);
  deck.position.y = baseY + height + 0.08;
  deck.castShadow = deck.receiveShadow = true;
  g.add(deck);

  // 灯室（发光玻璃筒）
  const room = new THREE.Mesh(
    new THREE.CylinderGeometry(CONFIG.lantern.radius, CONFIG.lantern.radius,
      CONFIG.lantern.height, 12),
    mats.glass);
  room.position.y = baseY + height + 0.16 + CONFIG.lantern.height / 2;
  g.add(room);

  // 顶盖
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(CONFIG.lantern.radius + 0.22, 0.7, 12),
    mats.dark);
  roof.position.y = baseY + height + 0.16 + CONFIG.lantern.height + 0.35;
  roof.castShadow = true;
  g.add(roof);

  return g;
}

function buildRocks() {
  const g = new THREE.Group();
  const rng = mulberry32(CONFIG.rocks.seed);
  const { count, islandRadius } = CONFIG.rocks;

  // 中央台石：承托灯塔的扁平台面
  const platform = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9, 1), mats.rockPlate());
  platform.scale.y = 0.42;
  platform.position.y = 0.62;
  platform.castShadow = platform.receiveShadow = true;
  g.add(platform);

  // 环绕岩块
  for (let i = 0; i < count; i++) {
    const r = 0.55 + rng() * 0.75;
    const geo = new THREE.IcosahedronGeometry(r, 0);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let j = 0; j < pos.count; j++) {
      v.fromBufferAttribute(pos, j);
      const n = vertexNoise(v.x, v.y, v.z);
      v.multiplyScalar(0.8 + n * 0.5);
      pos.setXYZ(j, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();

    const rock = new THREE.Mesh(geo, mats.rock(rng));
    const angle = (i / count) * Math.PI * 2 + rng() * 0.6;
    const dist = islandRadius * (0.55 + rng() * 0.45);
    rock.position.set(Math.cos(angle) * dist, r * 0.28, Math.sin(angle) * dist);
    rock.scale.y = 0.55 + rng() * 0.3;
    rock.rotation.y = rng() * Math.PI * 2;
    rock.castShadow = rock.receiveShadow = true;
    g.add(rock);
  }
  return g;
}

// 礁石材质：深蓝灰系，颜色带随机微差
mats.rockPlate = () => new THREE.MeshStandardMaterial({
  color: 0x39415a, flatShading: true, roughness: 0.95 });
mats.rock = (rng) => new THREE.MeshStandardMaterial({
  color: new THREE.Color(0x39415a).offsetHSL(0, 0, (rng() - 0.5) * 0.08),
  flatShading: true, roughness: 0.95 });

const tower = buildTower();
const rocks = buildRocks();
scene.add(tower, rocks);

/* ============================================================
 * 海面（T3 将替换为 shader 涌浪）
 * ============================================================ */
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(CONFIG.sea.size, CONFIG.sea.size),
  new THREE.MeshStandardMaterial({ color: CONFIG.sea.color, roughness: 0.35 }));
sea.rotation.x = -Math.PI / 2;
sea.receiveShadow = true;
scene.add(sea);

/* ============================================================
 * 动画（统一 tick）
 * ============================================================ */
renderer.setAnimationLoop((t) => {
  renderer.render(scene, camera);
});
</script>
</body>
</html>
