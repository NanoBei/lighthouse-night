<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海边灯塔夜景</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1224; overflow: hidden; }
  canvas { display: block; }
  #fallback { position: fixed; inset: 0; z-index: 20; display: none;
    place-items: center; background: #0a1224; color: #8ab4ff;
    font: 15px/1.8 system-ui, sans-serif; text-align: center; }
  #fallback.show { display: grid; }
  #hint { position: fixed; left: 14px; bottom: 12px; z-index: 10;
    color: rgba(200, 214, 240, 0.55); font: 13px/1.6 system-ui, sans-serif;
    pointer-events: none; user-select: none; }
</style>
</head>
<body>
<div id="hint"></div>
<div id="fallback">
  <div>
    <p>⚠️ Three.js 加载失败</p>
    <p>本页面需要联网从 CDN 加载 Three.js，请检查网络后刷新重试。</p>
  </div>
</div>

<script nomodule>document.getElementById('fallback').classList.add('show');</script>
<script type="module">
/* ============================================================
 * 配置区：全部可调参数集中于此
 * ============================================================ */
const CONFIG = {
  cdns: [
    'https://registry.npmmirror.com/three/0.187.0/files/build/three.module.js',
    'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js',
  ],
  camera: { fov: 50, position: [11, 6.5, 15], lookAt: [0, 4, 0] },
  orbit: {
    minR: 8, maxR: 60,       // 缩放限位
    minPhi: 0.15, maxPhi: 1.52, // 俯仰限位（不钻到海面以下）
    rotSpeed: 0.005, zoomSpeed: 0.0012, damping: 4.5,
  },
  tower: {
    baseY: 1.0,          // 塔身起始高度（立于礁石台面）
    height: 6,           // 塔身总高
    bottomRadius: 1.2,
    topRadius: 0.7,
    stripes: 5,          // 条纹段数（红白交替）
  },
  lantern: { radius: 0.55, height: 0.9 },
  rocks: { seed: 20261119, count: 9, islandRadius: 3.0 },
  sea: {
    size: 240, color: 0x0b1e3a, segments: 180,
    waves: [  // 三层正弦波叠加（幅度 / 波长 / 方向 / 相速度）
      { amp: 0.28, len: 14,  dir: [1, 0.3],  speed: 1.2 },
      { amp: 0.16, len: 7.5, dir: [-0.7, 1], speed: 1.8 },
      { amp: 0.09, len: 4,   dir: [0.3, -1], speed: 2.6 },
    ],
  },
  sky: {
    background: 0x0a1224,
    zenith: 0x050915,        // 天顶色
    horizon: 0x1b2a4d,       // 地平线色
    radius: 220,
    stars: { count: 320, bright: 60 },
    moon: { size: 7, tint: 0xf5f3e7 },
    clouds: { count: 8, seed: 7, color: 0x808aa0, speed: 0.6 },
    fog: { color: 0x0a1224, density: 0.008 },
    hint: 'C 切换天气 · 拖拽旋转 · 滚轮缩放',
  },
  lights: {
    hemi: { sky: 0x2a3a5e, ground: 0x0a0e1a, intensity: 0.55 },
    moon: { color: 0xbdd4ff, intensity: 1.8, position: [-30, 12, -28] }, // 相机左前方：海上明月
    fill: { color: 0x8fa8d8, intensity: 0.5, position: [10, 8, 22] }, // 相机侧补光，防止背光面全黑
    lamp: { color: 0xffd9a0, intensity: 60, distance: 45 },
  },
  beam: {
    color: 0xffe0b0, length: 36, nearR: 0.15, farR: 1.7,
    tilt: 0.09,          // 光束微下倾（弧度）
    opacity: 0.55, speed: 0.5,  // 扫射角速度 rad/s
    spot: { intensity: 50, angle: 0.12, penumbra: 0.6 },
  },
  weather: {
    transition: 3,             // 状态过渡时长（秒）
    autoMin: 25, autoMax: 40,  // 自动轮换间隔（秒）
    rain: { count: 1500, area: 34, height: 26, speed: 11, len: 0.55 },
    states: {  // 各天气的目标环境参数
      clear:  { fog: 0.008,  moonI: 1,    moonO: 1,    wave: 1,    rain: 0, extraCloud: 0 },
      cloudy: { fog: 0.014,  moonI: 0.5,  moonO: 0.45, wave: 1.15, rain: 0, extraCloud: 0.85 },
      rainy:  { fog: 0.022,  moonI: 0.22, moonO: 0.15, wave: 1.3,  rain: 1, extraCloud: 0.9 },
    },
  },
  gull: {
    flyTime: 2,   // 飞离/飞回的渐变时长（秒）
    flap: 7,      // 扇翅频率（rad/s）
  },
};

/* ============================================================
 * 加载：双 CDN 源动态 import，双源均失败显示兜底提示
 * ============================================================ */
let THREE = null;
for (const url of CONFIG.cdns) {
  try { THREE = await import(url); break; } catch (e) { /* 换下一个源 */ }
}
if (!THREE) {
  document.getElementById('fallback').classList.add('show');
  throw new Error('all CDNs failed');
}
document.getElementById('hint').textContent = CONFIG.sky.hint;

/* ============================================================
 * 场景与灯光
 * ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.sky.background);
scene.fog = new THREE.FogExp2(CONFIG.sky.fog.color, CONFIG.sky.fog.density);

const camera = new THREE.PerspectiveCamera(
  CONFIG.camera.fov, innerWidth / innerHeight, 0.1, 500);
camera.position.set(...CONFIG.camera.position);
camera.lookAt(...CONFIG.camera.lookAt);

scene.add(new THREE.HemisphereLight(
  CONFIG.lights.hemi.sky, CONFIG.lights.hemi.ground, CONFIG.lights.hemi.intensity));

const moonLight = new THREE.DirectionalLight(
  CONFIG.lights.moon.color, CONFIG.lights.moon.intensity);
moonLight.position.set(...CONFIG.lights.moon.position);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -20;
moonLight.shadow.camera.right = 20;
moonLight.shadow.camera.top = 20;
moonLight.shadow.camera.bottom = -20;
scene.add(moonLight);

const fillLight = new THREE.DirectionalLight(
  CONFIG.lights.fill.color, CONFIG.lights.fill.intensity);
fillLight.position.set(...CONFIG.lights.fill.position);
scene.add(fillLight);

const lanternY = CONFIG.tower.baseY + CONFIG.tower.height + 0.16
  + CONFIG.lantern.height / 2; // 灯室中心高度

const lampLight = new THREE.PointLight(
  CONFIG.lights.lamp.color, CONFIG.lights.lamp.intensity, CONFIG.lights.lamp.distance);
lampLight.position.set(0, lanternY, 0); // 灯室内部
scene.add(lampLight);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
 * 灯塔与礁石
 * ============================================================ */
// 确定性伪随机：相同 seed 每次刷新结果一致
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// 基于坐标的噪声：保证同一几何体的重合顶点扰动一致（面不裂开）
function vertexNoise(x, y, z) {
  const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  return s - Math.floor(s);
}

const mats = {
  red:   new THREE.MeshStandardMaterial({ color: 0xc0392b, flatShading: true, roughness: 0.85 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe8e4d8, flatShading: true, roughness: 0.85 }),
  dark:  new THREE.MeshStandardMaterial({ color: 0x2c3444, flatShading: true, roughness: 0.9 }),
  glass: new THREE.MeshStandardMaterial({
    color: 0xfff2cc, emissive: 0xffb347, emissiveIntensity: 1.4, roughness: 0.4 }),
};

function buildTower() {
  const g = new THREE.Group();
  const { baseY, height, bottomRadius, topRadius, stripes } = CONFIG.tower;
  const segH = height / stripes;

  for (let i = 0; i < stripes; i++) {
    const t0 = i / stripes, t1 = (i + 1) / stripes;
    const rb = bottomRadius + (topRadius - bottomRadius) * t0;
    const rt = bottomRadius + (topRadius - bottomRadius) * t1;
    const seg = new THREE.Mesh(
      new THREE.CylinderGeometry(rt, rb, segH, 16, 1),
      i % 2 === 0 ? mats.red : mats.white);
    seg.position.y = baseY + segH * (i + 0.5);
    seg.castShadow = seg.receiveShadow = true;
    g.add(seg);
  }

  // 阳台
  const deck = new THREE.Mesh(
    new THREE.CylinderGeometry(topRadius + 0.28, topRadius + 0.28, 0.16, 16),
    mats.dark);
  deck.position.y = baseY + height + 0.08;
  deck.castShadow = deck.receiveShadow = true;
  g.add(deck);

  // 灯室（发光玻璃筒）
  const room = new THREE.Mesh(
    new THREE.CylinderGeometry(CONFIG.lantern.radius, CONFIG.lantern.radius,
      CONFIG.lantern.height, 12),
    mats.glass);
  room.position.y = baseY + height + 0.16 + CONFIG.lantern.height / 2;
  g.add(room);

  // 顶盖
  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(CONFIG.lantern.radius + 0.22, 0.7, 12),
    mats.dark);
  roof.position.y = baseY + height + 0.16 + CONFIG.lantern.height + 0.35;
  roof.castShadow = true;
  g.add(roof);

  return g;
}

function buildRocks() {
  const g = new THREE.Group();
  const rng = mulberry32(CONFIG.rocks.seed);
  const { count, islandRadius } = CONFIG.rocks;

  // 中央台石：承托灯塔的扁平台面
  const platform = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9, 1), mats.rockPlate());
  platform.scale.y = 0.42;
  platform.position.y = 0.62;
  platform.castShadow = platform.receiveShadow = true;
  g.add(platform);

  // 环绕岩块
  for (let i = 0; i < count; i++) {
    const r = 0.55 + rng() * 0.75;
    const geo = new THREE.IcosahedronGeometry(r, 0);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let j = 0; j < pos.count; j++) {
      v.fromBufferAttribute(pos, j);
      const n = vertexNoise(v.x, v.y, v.z);
      v.multiplyScalar(0.8 + n * 0.5);
      pos.setXYZ(j, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();

    const rock = new THREE.Mesh(geo, mats.rock(rng));
    const angle = (i / count) * Math.PI * 2 + rng() * 0.6;
    const dist = islandRadius * (0.55 + rng() * 0.45);
    rock.position.set(Math.cos(angle) * dist, r * 0.28, Math.sin(angle) * dist);
    rock.scale.y = 0.55 + rng() * 0.3;
    rock.rotation.y = rng() * Math.PI * 2;
    rock.castShadow = rock.receiveShadow = true;
    g.add(rock);
  }
  return g;
}

// 礁石材质：深蓝灰系，颜色带随机微差
mats.rockPlate = () => new THREE.MeshStandardMaterial({
  color: 0x39415a, flatShading: true, roughness: 0.95 });
mats.rock = (rng) => new THREE.MeshStandardMaterial({
  color: new THREE.Color(0x39415a).offsetHSL(0, 0, (rng() - 0.5) * 0.08),
  flatShading: true, roughness: 0.95 });

const tower = buildTower();
const rocks = buildRocks();
scene.add(tower, rocks);

/* ============================================================
 * 天空氛围：渐变天穹、星点、月亮、云
 * ============================================================ */
// 天穹：地平线亮、天顶深的大球内壁（shader 渐变，不受雾影响）
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(CONFIG.sky.radius, 24, 14),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uZenith: { value: new THREE.Color(CONFIG.sky.zenith) },
      uHorizon: { value: new THREE.Color(CONFIG.sky.horizon) },
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vDir;
      uniform vec3 uZenith;
      uniform vec3 uHorizon;
      void main() {
        float h = smoothstep(0.0, 0.35, vDir.y);
        gl_FragColor = vec4(mix(uHorizon, uZenith, h), 1.0);
      }`,
  }));
scene.add(skyDome);

// 星星：两层不同大小的点云（不受雾影响）
function makeStars(count, size, opacity, seed) {
  const rng = mulberry32(seed);
  const pos = new Float32Array(count * 3);
  const v = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    do {
      v.set(rng() * 2 - 1, rng(), rng() * 2 - 1).normalize();
    } while (v.y < 0.06); // 只分布在地平线以上
    pos.set([v.x, v.y, v.z].map((c) => c * CONFIG.sky.radius * 0.92), i * 3);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xdfe8ff, size, sizeAttenuation: false,
    transparent: true, opacity, fog: false,
  }));
}
scene.add(makeStars(CONFIG.sky.stars.count, 1.6, 0.9, 11));
scene.add(makeStars(CONFIG.sky.stars.bright, 2.6, 1.0, 12));

// 月亮：发光圆盘，位置与月光方向光一致，始终朝向相机
const moonGroup = new THREE.Group();
const moonDisc = new THREE.Mesh(
  new THREE.CircleGeometry(CONFIG.sky.moon.size, 28),
  new THREE.MeshBasicMaterial({
    color: CONFIG.sky.moon.tint, fog: false, transparent: true }));
moonGroup.add(moonDisc);
moonGroup.position.copy(new THREE.Vector3(...CONFIG.lights.moon.position))
  .normalize().multiplyScalar(CONFIG.sky.radius * 0.88);
scene.add(moonGroup);

// 低多边形云：块状簇缓慢漂移，远处融入夜色（基础组 + 天气备用组）
function buildClouds(seed, count) {
  const rng = mulberry32(seed);
  const mat = new THREE.MeshStandardMaterial({
    color: CONFIG.sky.clouds.color, flatShading: true, roughness: 1,
    emissive: 0x2a3550, emissiveIntensity: 1 }); // 夜云提亮，避免黑块
  const group = new THREE.Group();
  group.userData.mat = mat;
  for (let i = 0; i < count; i++) {
    const cloud = new THREE.Group();
    const puffs = 3 + Math.floor(rng() * 3);
    for (let j = 0; j < puffs; j++) {
      const s = 2.2 + rng() * 3.2;
      const puff = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), mat);
      puff.position.set((rng() - 0.5) * 7, (rng() - 0.5) * 1.4, (rng() - 0.5) * 3);
      puff.scale.y = 0.5 + rng() * 0.2;
      cloud.add(puff);
    }
    const angle = rng() * Math.PI * 2;
    const dist = 45 + rng() * 65;
    cloud.position.set(Math.cos(angle) * dist, 22 + rng() * 16, Math.sin(angle) * dist);
    cloud.userData.speed = (0.4 + rng() * 0.5) * CONFIG.sky.clouds.speed;
    group.add(cloud);
  }
  return group;
}
const cloudsBase = buildClouds(CONFIG.sky.clouds.seed, CONFIG.sky.clouds.count);
const cloudsExtra = buildClouds(CONFIG.sky.clouds.seed + 101, CONFIG.sky.clouds.count);
cloudsExtra.userData.mat.transparent = true; // 备用云组：多云/雨夜渐显
cloudsExtra.userData.mat.opacity = 0;
cloudsExtra.visible = false;
scene.add(cloudsBase, cloudsExtra);

/* ============================================================
 * 海面：标准材质 + onBeforeCompile 注入三层正弦波涌浪
 * （GPU 顶点位移 + 解析法线；光照、雾、阴影管线全部保留）
 * ============================================================ */
const seaUniforms = { uTime: { value: 0 }, uWaveScale: { value: 1 } };

// 由 CONFIG 生成波参数常量与波场函数（波高 + 解析梯度）
const seaWaveGLSL = CONFIG.sea.waves.map((w, i) => {
  const k = (Math.PI * 2) / w.len;
  const [dx, dy] = w.dir;
  const n = Math.hypot(dx, dy);
  return [
    `const vec2 WDIR${i} = vec2(${(dx / n).toFixed(5)}, ${(dy / n).toFixed(5)});`,
    `const float WAMP${i} = ${w.amp.toFixed(4)};`,
    `const float WK${i} = ${k.toFixed(5)};`,
    `const float WSPD${i} = ${w.speed.toFixed(3)};`,
  ].join('\n');
}).join('\n') + `
uniform float uWaveScale; // 天气波高系数（雨夜风浪增大）
float waveField(vec2 p, out vec2 grad) {
  float h = 0.0;
  grad = vec2(0.0);` +
  CONFIG.sea.waves.map((_, i) => `
  {
    float ph = dot(WDIR${i}, p) * WK${i} + uTime * WSPD${i};
    h += WAMP${i} * uWaveScale * sin(ph);
    grad += WAMP${i} * WK${i} * WDIR${i} * uWaveScale * cos(ph);
  }`).join('') + `
  return h;
}`;

const seaMat = new THREE.MeshStandardMaterial({
  color: CONFIG.sea.color, roughness: 0.35, metalness: 0.1 });
seaMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = seaUniforms.uTime;
  shader.uniforms.uWaveScale = seaUniforms.uWaveScale;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
uniform float uTime;
${seaWaveGLSL}`)
    .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
{ vec2 g; waveField(position.xy, g); objectNormal = normalize(vec3(-g.x, -g.y, 1.0)); }`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
{ vec2 g2; transformed.z += waveField(position.xy, g2); }`);
};

const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(CONFIG.sea.size, CONFIG.sea.size,
    CONFIG.sea.segments, CONFIG.sea.segments),
  seaMat);
sea.rotation.x = -Math.PI / 2;
sea.receiveShadow = true;
scene.add(sea);

/* ============================================================
 * 光束系统：双光束锥（additive 伪体积）+ 灯室光晕 + 同步扫射聚光灯
 * ============================================================ */
// 程序生成径向渐变光晕贴图（canvas 纯代码，无外部资源）
function makeHaloTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255, 224, 176, 0.85)');
  g.addColorStop(0.35, 'rgba(255, 210, 150, 0.35)');
  g.addColorStop(1, 'rgba(255, 200, 130, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeHaloTexture(), transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
halo.scale.set(3.8, 3.8, 1);
halo.position.set(0, lanternY, 0);
scene.add(halo);

const beamGroup = new THREE.Group();
beamGroup.position.set(0, lanternY, 0);
scene.add(beamGroup);

// 光束锥 shader：沿长度渐隐（近端柔起、远端消散），避免均匀 opacity 的「灰板」感
const beamMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  side: THREE.DoubleSide, blending: THREE.AdditiveBlending, fog: false,
  uniforms: {
    uColor: { value: new THREE.Color(CONFIG.beam.color) },
    uOpacity: { value: CONFIG.beam.opacity },
    uLength: { value: CONFIG.beam.length },
  },
  vertexShader: /* glsl */`
    varying float vT;
    uniform float uLength;
    void main() {
      vT = clamp(-position.y / uLength, 0.0, 1.0); // 0=灯室端 → 1=远端
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */`
    varying float vT;
    uniform vec3 uColor;
    uniform float uOpacity;
    void main() {
      float a = uOpacity
        * smoothstep(0.0, 0.05, vT)    // 灯室端柔起，避免过曝堆积
        * pow(1.0 - vT, 1.3);          // 沿距离渐隐
      gl_FragColor = vec4(uColor, a);
    }`,
});
const beamGeo = new THREE.CylinderGeometry(
  CONFIG.beam.nearR, CONFIG.beam.farR, CONFIG.beam.length, 24, 1, true);
beamGeo.translate(0, -CONFIG.beam.length / 2, 0); // 锥顶在原点，沿 -y 延伸

for (const side of [0, Math.PI]) { // 两条对置光束
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.rotation.order = 'YXZ';
  beam.rotation.y = side;
  beam.rotation.x = Math.PI / 2 - CONFIG.beam.tilt; // 转为水平并微下倾
  beamGroup.add(beam);
}

// 聚光灯与光束同轴旋转，在水面扫出真实亮斑
const beamSpot = new THREE.SpotLight(CONFIG.beam.color,
  CONFIG.beam.spot.intensity, 60, CONFIG.beam.spot.angle,
  CONFIG.beam.spot.penumbra, 1.2);
beamSpot.position.set(0, lanternY, 0);
const spotTarget = new THREE.Object3D();
spotTarget.position.set(0, -Math.sin(CONFIG.beam.tilt) * 30, -Math.cos(CONFIG.beam.tilt) * 30);
beamGroup.add(spotTarget); // 放入光束组，随其旋转
beamSpot.target = spotTarget;
scene.add(beamSpot);

/* ============================================================
 * 天气系统：三态状态机 + 统一插值器 + 雨丝粒子
 * ============================================================ */
const WEATHER_ORDER = ['clear', 'cloudy', 'rainy'];
const weatherState = { ...CONFIG.weather.states.clear }; // 当前插值中的参数
let weatherFrom = { ...weatherState };
let weatherTo = { ...weatherState };
let weatherT = 1;              // 过渡进度 0→1（1 = 已到位）
let weatherName = 'clear';
let autoTimer = 0;
const randRange = (a, b) => a + Math.random() * (b - a);
let autoNext = randRange(CONFIG.weather.autoMin, CONFIG.weather.autoMax);

function applyWeather() {
  const p = weatherState;
  scene.fog.density = p.fog;
  moonLight.intensity = CONFIG.lights.moon.intensity * p.moonI;
  moonDisc.material.opacity = p.moonO;
  seaUniforms.uWaveScale.value = p.wave;
  cloudsExtra.visible = p.extraCloud > 0.02;
  cloudsExtra.userData.mat.opacity = p.extraCloud;
}

function setWeather(name) {
  weatherName = name;
  weatherFrom = { ...weatherState };
  weatherTo = { ...CONFIG.weather.states[name] };
  weatherT = 0;
  autoTimer = 0; // 手动与自动切换都重置轮换计时
  autoNext = randRange(CONFIG.weather.autoMin, CONFIG.weather.autoMax);
}

addEventListener('keydown', (e) => {
  if (e.key === 'c' || e.key === 'C') {
    setWeather(WEATHER_ORDER[(WEATHER_ORDER.indexOf(weatherName) + 1) % 3]);
  }
});

// 雨丝：LineSegments 竖直微斜，跟随相机循环下落（纯代码无贴图）
const rainCfg = CONFIG.weather.rain;
const rainGeo = new THREE.BufferGeometry();
{
  const pos = new Float32Array(rainCfg.count * 6);
  for (let i = 0; i < rainCfg.count; i++) {
    pos[i * 6]     = (Math.random() - 0.5) * rainCfg.area;
    pos[i * 6 + 1] = Math.random() * rainCfg.height;
    pos[i * 6 + 2] = (Math.random() - 0.5) * rainCfg.area;
  }
  rainGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
}
const rainMat = new THREE.LineBasicMaterial({
  color: 0x9fb4d8, transparent: true, opacity: 0 });
const rain = new THREE.LineSegments(rainGeo, rainMat);
rain.frustumCulled = false;
rain.visible = false;
scene.add(rain);
const DROP = (() => { // 雨丝方向（微斜），尾端 = 头端 + DROP
  const k = rainCfg.len / Math.hypot(0.25, 1);
  return [0.25 * k, -k, 0];
})();

function updateRain(dt) {
  if (weatherState.rain > 0.02) {
    rain.visible = true;
    rainMat.opacity = 0.5 * weatherState.rain;
    rain.position.set(camera.position.x, 0, camera.position.z);
    const a = rainGeo.attributes.position.array;
    for (let i = 0; i < rainCfg.count; i++) {
      const j = i * 6;
      a[j + 1] -= rainCfg.speed * dt;
      if (a[j + 1] < 0) { // 落到底 → 回顶部随机位置
        a[j]     = (Math.random() - 0.5) * rainCfg.area;
        a[j + 1] = rainCfg.height * (0.9 + Math.random() * 0.2);
        a[j + 2] = (Math.random() - 0.5) * rainCfg.area;
      }
      a[j + 3] = a[j] + DROP[0];
      a[j + 4] = a[j + 1] + DROP[1];
      a[j + 5] = a[j + 2] + DROP[2];
    }
    rainGeo.attributes.position.needsUpdate = true;
  } else {
    rain.visible = false;
  }
}

/* ============================================================
 * 海鸥群：绕塔盘旋 + 扇翅 + 天气联动（雨天结伴飞离）
 * ============================================================ */
const gulls = [];
{
  const mat = new THREE.MeshStandardMaterial({
    color: 0xdfe3ea, flatShading: true, roughness: 0.8, transparent: true });
  const bodyGeo = new THREE.DodecahedronGeometry(0.22, 0);
  const wingGeo = new THREE.BoxGeometry(0.55, 0.04, 0.24);
  wingGeo.translate(0.3, 0, 0); // 翼根为旋转轴

  // 各自不同的轨道：半径 / 宽度 / 高度 / 相位 / 角速度
  const orbits = [
    { a: 10, b: 5,   h: 9,  phase: 0,   speed: 0.5 },
    { a: 13, b: 6.5, h: 11, phase: 2.1, speed: 0.42 },
    { a: 16, b: 7.5, h: 13, phase: 4.2, speed: 0.35 },
  ];
  for (const o of orbits) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(bodyGeo, mat);
    body.scale.set(0.9, 0.75, 1.7); // z 为前向（+z 对准飞行方向）
    body.castShadow = true;
    g.add(body);
    const wl = new THREE.Mesh(wingGeo, mat);
    const wr = new THREE.Mesh(wingGeo, mat);
    wr.rotation.y = Math.PI;
    wl.position.set(-0.1, 0.06, 0);
    wr.position.set(0.1, 0.06, 0);
    g.add(wl, wr);
    g.userData = { ...o, wl, wr };
    scene.add(g);
    gulls.push(g);
  }
}
const gullMat = gulls[0].children[0].material;
let gullFly = 0;        // 0 = 在场盘旋 → 1 = 已飞离
let gullFlyTarget = 0;

function updateGulls(t, dt) {
  // 天气联动：雨大则飞离，转好则飞回
  gullFlyTarget = weatherState.rain > 0.5 ? 1 : 0;
  if (gullFly !== gullFlyTarget) {
    const dir = Math.sign(gullFlyTarget - gullFly);
    gullFly = THREE.MathUtils.clamp(gullFly + dir * dt / CONFIG.gull.flyTime, 0, 1);
    gullMat.opacity = 1 - gullFly;
  }
  const present = gullFly < 0.999;
  for (const g of gulls) {
    g.visible = present;
    if (!present) continue;
    const o = g.userData;
    const ang = t / 1000 * o.speed + o.phase;
    const px = Math.cos(ang) * o.a, pz = Math.sin(ang) * o.b;
    const py = o.h + Math.sin(ang * 2.3 + o.phase) * 0.6; // 轻微起伏
    // 飞离偏移：结伴向远方飞升
    const ox = gullFly * 55, oy = gullFly * 18, oz = gullFly * 30;
    g.position.set(px + ox, py + oy, pz + oz);
    g.lookAt( // 朝向轨道切线（略前方的未来位置）
      Math.cos(ang + 0.12) * o.a + ox, py + oy + 0.4,
      Math.sin(ang + 0.12) * o.b + oz);
    const flap = Math.sin(t / 1000 * CONFIG.gull.flap + o.phase * 3) * 0.55;
    o.wl.rotation.z = flap;
    o.wr.rotation.z = -flap;
  }
}

/* ============================================================
 * 相机控制：手写轨道控制器（球坐标 + 阻尼 + 触屏）
 * Pointer Events 统一鼠标与触屏：单指旋转、双指捏合缩放、滚轮缩放
 * ============================================================ */
const orbit = { ...CONFIG.orbit,
  target: new THREE.Vector3(...CONFIG.camera.lookAt) };
{
  const off = camera.position.clone().sub(orbit.target);
  orbit.r = off.length();
  orbit.phi = Math.acos(off.y / orbit.r);
  orbit.theta = Math.atan2(off.x, off.z);
}

let dragging = false, velT = 0, velP = 0, lastMoveT = 0;
const pointers = new Map();
let pinchDist = 0;

const canvasEl = renderer.domElement;
canvasEl.style.touchAction = 'none'; // 交给我们自己处理手势

const clampPhi = () => {
  orbit.phi = THREE.MathUtils.clamp(orbit.phi, orbit.minPhi, orbit.maxPhi);
};
const zoomBy = (f) => {
  orbit.r = THREE.MathUtils.clamp(orbit.r * f, orbit.minR, orbit.maxR);
};

canvasEl.addEventListener('pointerdown', (e) => {
  canvasEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { dragging = true; velT = velP = 0; }
  if (pointers.size === 2) { // 进入捏合
    dragging = false;
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});
canvasEl.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pointers.size === 1 && dragging) { // 单指旋转（含鼠标拖拽）
    orbit.theta -= dx * orbit.rotSpeed;
    orbit.phi -= dy * orbit.rotSpeed;
    clampPhi();
    // 记录角速度用于松手惯性（依据事件间隔换算为 rad/s）
    const now = performance.now();
    const edt = Math.max(now - lastMoveT, 1);
    lastMoveT = now;
    velT = (-dx * orbit.rotSpeed / edt) * 1000;
    velP = (-dy * orbit.rotSpeed / edt) * 1000;
  } else if (pointers.size === 2) { // 双指捏合缩放
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0 && d > 0) zoomBy(pinchDist / d);
    pinchDist = d;
  }
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) dragging = false;
  if (pointers.size < 2) pinchDist = 0;
};
canvasEl.addEventListener('pointerup', endPointer);
canvasEl.addEventListener('pointercancel', endPointer);

canvasEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  zoomBy(Math.exp(e.deltaY * orbit.zoomSpeed));
}, { passive: false });

/* ============================================================
 * 动画（统一 tick）
 * ============================================================ */
let lastT = 0;
renderer.setAnimationLoop((t) => {
  const dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  // 海面涌浪
  seaUniforms.uTime.value = t / 1000;

  // 光束旋转扫射
  beamGroup.rotation.y += CONFIG.beam.speed * dt;

  // 相机：松手后惯性 + 阻尼缓停，再由球坐标驱动
  if (!dragging) {
    orbit.theta += velT * dt;
    orbit.phi += velP * dt;
    clampPhi();
    const damp = Math.exp(-orbit.damping * dt);
    velT *= damp; velP *= damp;
  }
  {
    const sp = Math.sin(orbit.phi), cp = Math.cos(orbit.phi);
    camera.position.set(
      orbit.target.x + orbit.r * sp * Math.sin(orbit.theta),
      orbit.target.y + orbit.r * cp,
      orbit.target.z + orbit.r * sp * Math.cos(orbit.theta));
    camera.lookAt(orbit.target);
  }

  // 天气：过渡插值 + 自动轮换
  if (weatherT < 1) {
    weatherT = Math.min(weatherT + dt / CONFIG.weather.transition, 1);
    const s = weatherT * weatherT * (3 - 2 * weatherT); // smoothstep 缓入缓出
    for (const key in weatherState) {
      weatherState[key] = weatherFrom[key] + (weatherTo[key] - weatherFrom[key]) * s;
    }
  }
  autoTimer += dt;
  if (autoTimer >= autoNext) {
    const pool = WEATHER_ORDER.filter((n) => n !== weatherName);
    setWeather(pool[Math.floor(Math.random() * pool.length)]);
  }
  applyWeather();
  updateRain(dt);

  // 云缓慢漂移，超出范围回绕（基础组 + 天气备用组）
  for (const cloud of cloudsBase.children) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 160) cloud.position.x = -160;
  }
  for (const cloud of cloudsExtra.children) {
    cloud.position.x += cloud.userData.speed * dt;
    if (cloud.position.x > 160) cloud.position.x = -160;
  }
  moonGroup.lookAt(camera.position);

  // 海鸥：盘旋 + 扇翅 + 天气联动
  updateGulls(t, dt);

  renderer.render(scene, camera);
});
</script>
</body>
</html>
